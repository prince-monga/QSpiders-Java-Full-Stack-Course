<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin:0;
        }
        section{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            height: 80%;
            width: 80%;
            border-radius: 12px;
        }
        #d1 {
            background-color: rgb(242, 8, 8);
        }
        #d2 {
            background-color: rgb(250, 224, 57);
        }
        #d3 {
            background-color: rgb(128, 240, 232);
        }
    </style>
</head>

<body>
    <section>
    <div id="d1">
        <div id="d2">
            <div id="d3">
               

            </div>
        </div>
    </div>
</section>
</body>

</html>
